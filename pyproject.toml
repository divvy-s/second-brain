[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-os"
version = "0.1.0"
description = "Plugin-driven AI operating system for cross-app context, memory, and autonomous action."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "redis>=5.0",
  "chromadb>=0.5",
  "spacy>=3.7",
  "openai>=1.35",
  "langgraph>=0.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "psycopg2-binary>=2.9.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5"
]

[tool.setuptools]
packages = [
  "connectors",
  "connectors.mcp",
  "memory",
  "intelligence",
  "orchestration",
  "agents",
  "execution",
  "api",
  "second_brain_sdk"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "pytest-cache-files-*"]
addopts = "-p no:cacheprovider"

